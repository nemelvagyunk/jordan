<template name="Main_layout">
    <div id="{{#unless currentUser}}no-user{{/unless}}">
        <!-- Wrapper-->
        <div id="wrapper">

            <!-- Navigation -->
            {{> Navigation }}

            <!-- Page wrapper-->
            <div id="page-wrapper" class="gray-bg">

                {{> Top_navbar }}
                {{> Template.dynamic template=content}}
                {{> Footer }}

            </div>
            <!-- End Page wrapper-->
            
            {{!-- SMART atalakitas (2026-08-25): a jobb also sarokban lebego zold
                 kerdojeles technikai-tamogatas buborek (Tech_chat) eltavolitva
                 (Attila kerese). Visszaallitas: a lenti blokk kikommentelese
                 megszuntetheto. --}}
            {{!--
            <div>
                {{#unless currentUserHasPermission 'do.techsupport'}}
                {{> Tech_chat}}
                {{/unless}}
            </div>
            --}}

            <!-- Right Sidebar -->
            <div>
                {{> Right_sidebar }}
            </div>

        </div>
        <!-- End wrapper-->
    </div>

    {{> Connection_issue}}
    {{> Promotion}}
    {{> Live_Chat}}
    {{> Live_Vote}}
    {{!-- SMART: KK szavazasvezerlo pult a video alatt (csak a kozos kepviselo latja) --}}
    {{> Vote_control}}

</template>
